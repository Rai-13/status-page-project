<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Monitor</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background">
        <div class="glow-orb orb-1"></div>
        <div class="glow-orb orb-2"></div>
    </div>
    
    <div class="container">
        <header>
            <div class="brand">
                <div class="logo"></div>
                <h1>Host Server Monitor</h1>
            </div>
            <div class="global-status" id="global-status">
                <span class="status-indicator"></span>
                <span class="status-text">Checking system status...</span>
            </div>
        </header>

        <main>
            <section class="infra-section">
                <h2>Docker Infrastructure</h2>
                <div class="infra-grid" id="infra-grid">
                    <div class="infra-card skeleton">
                        <div class="skeleton-text" style="width:40%"></div>
                        <div class="skeleton-text" style="width:70%; margin-top:0.5rem; height: 2rem;"></div>
                    </div>
                </div>
            </section>

            <section class="services-section">
                <h2>System Resources (Host)</h2>
                <div class="metrics-grid" id="metrics-grid">
                    <!-- Gauge Cards injected here -->
                </div>
            </section>
        </main>
        
        <footer>
            <p>System metrics logged every 30 seconds. &copy; 2026 Company Inc.</p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
