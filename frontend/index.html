<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Monitor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background">
        <div class="tech-grid"></div>
        <div class="glow-orb orb-1"></div>
        <div class="glow-orb orb-2"></div>
    </div>
    
    <div class="container">
        <header class="glass-header">
            <div class="brand">
                <div class="logo">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 100%; height: 100%;">
                        <defs>
                            <linearGradient id="logo-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#38bdf8" />
                                <stop offset="100%" stop-color="#8b5cf6" />
                            </linearGradient>
                        </defs>
                        <path d="M22 12h-4l-3 9L9 3l-3 9H2" stroke="url(#logo-gradient)"></path>
                    </svg>
                </div>
                <h1>System Monitor and Infrastructure Dashboard</h1>
            </div>
            <div class="header-controls">
                <div class="global-status" id="global-status">
                    <span class="status-indicator"></span>
                    <span class="status-text">Checking system status...</span>
                </div>
                <label class="theme-switch" title="Toggle Light/Dark Mode">
                    <input type="checkbox" id="theme-toggle">
                    <span class="slider round"></span>
                </label>
            </div>
        </header>

        <main>
            <section class="infra-section" id="host-infra">
                <h2>Host Infrastructure</h2>
                <div class="infra-grid" id="host-grid">
                    <div class="infra-card skeleton">
                        <div class="skeleton-text" style="width:40%"></div>
                        <div class="skeleton-text" style="width:70%; margin-top:0.5rem; height: 2rem;"></div>
                    </div>
                </div>
            </section>

            <section class="services-section" id="resources">
                <h2>System Resources</h2>
                <div class="metrics-grid" id="metrics-grid">
                    <!-- Gauge Cards injected here -->
                </div>
            </section>

            <section class="infra-section" id="ecosystem">
                <h2>Docker & Kubernetes Ecosystem</h2>
                <div class="infra-grid" id="ecosystem-grid">
                    <div class="infra-card skeleton">
                        <div class="skeleton-text" style="width:40%"></div>
                        <div class="skeleton-text" style="width:70%; margin-top:0.5rem; height: 2rem;"></div>
                    </div>
                </div>
            </section>
        </main>
        
        <footer>
            <p>System metrics logged every 5 seconds. &copy; 2026 Company Inc.</p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
