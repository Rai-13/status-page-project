name: CI Pipeline

on:
  pull_request:
    branches: [ "main" ]

jobs:
  test-status-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          
      - name: Install dependencies
        working-directory: status-checker
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Check syntax
        working-directory: status-checker
        run: |
          python -m py_compile check_health.py

  build-checker-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Build Docker image
        working-directory: status-checker
        run: docker build -t status-checker:test .
